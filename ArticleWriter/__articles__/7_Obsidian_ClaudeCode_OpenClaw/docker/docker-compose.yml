##############################################################################
# Second Brain -- Docker stack for Intel home server
#
# Services:
#   obsidian-remote  — full Obsidian UI accessible via browser
#   obsidian-api     — REST API for programmatic vault access
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
#
# Access:
#   Obsidian UI    → http://<server-ip>:8080
#   REST API docs  → http://<server-ip>:5000/docs
##############################################################################

services:
  obsidian-remote:
    image: ghcr.io/sytone/obsidian-remote:latest
    container_name: obsidian-remote
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ${VAULT_PATH:-~/obsidian-vault}:/vaults/second-brain
      - obsidian-config:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}

  obsidian-api:
    image: guillaumeredoules/obsidian-api
    container_name: obsidian-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    volumes:
      - ${VAULT_PATH:-~/obsidian-vault}:/vault:rw
    environment:
      - SECRET_KEY=${API_SECRET_KEY:-change-me-in-dotenv}
      - USER=${API_USER:-admin}
      - PASSWORD=${API_PASSWORD:-change-me-in-dotenv}

volumes:
  obsidian-config:
